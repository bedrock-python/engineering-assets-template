# One-off operations that override a safeguard of touchmark (format v1). This
# file goes through review like the packs, and only distribute on the default
# branch carries it out: in CI, touchmark refuses the command-line flags that
# do the same. Every entry limits itself (a branch head, a pull request number,
# a date), so a forgotten entry does nothing; `touchmark check` warns about
# entries that have expired. The JSON Schema: `touchmark schema operations`.
version: 1

# Rebuild a paused sync branch that someone else pushed to. Their commits on it
# are dropped. Acts only while the branch head is this commit.
# recreate:
#   - target: gh:acme/api
#     head: 4b1d9e0c8f5a3b2e1d0c9b8a7f6e5d4c3b2a1f0e

# Propose again what a target declined by closing a sync pull request.
# touchmark marks that pull request revoked, so the entry acts once.
# forget_declines:
#   - target: gh:acme/docs
#     pr: 44

# Let distribute close more pull requests in one run than the guard allows,
# until the end of that day (UTC).
# allow_mass_close: { max: 400, until: 2026-12-31 }
